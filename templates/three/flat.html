<!doctype html>
<!-- 2.5D in HyperFrames (Locked Stack row 22 fallback): layered planes under one CSS perspective,
     moved by the paused GSAP timeline. Used when three.js fails or a Blender hero shot would pass
     the render-time cap. Same job data as three/index.html and three/hero.py. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=__W__, height=__H__" />
  <script src="__GSAP__" integrity="__GSAP_SRI__" crossorigin="anonymous"></script>
  <style>__TOKENS_CSS__</style>
  <style>
    #stage { position: absolute; inset: 0; perspective: 1400px; z-index: 0; }
    .plane { position: absolute; left: 50%; top: 58%; border-radius: 50%; transform-style: preserve-3d; }
    #back { width: 70vmin; height: 70vmin; margin: -35vmin 0 0 -35vmin; border: 2vmin solid var(--accent-2); opacity: 0.6; }
    #mid { width: 46vmin; height: 46vmin; margin: -23vmin 0 0 -23vmin; border: 7vmin solid var(--accent); }
    #front { width: 16vmin; height: 16vmin; margin: -8vmin 0 0 -8vmin; background: var(--ink); opacity: 0.9; }
    #safe { z-index: 1; display: flex; flex-direction: column; gap: 0.3em; }
    .title { font-size: var(--display); font-weight: var(--w-display); letter-spacing: -0.02em; }
    .line { font-size: var(--body); color: var(--muted); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__"
       data-width="__W__" data-height="__H__" data-fps="__FPS__">
    <div id="stage"><div class="plane" id="back"></div><div class="plane" id="mid"></div>
      <div class="plane" id="front"></div></div>
    <div id="safe" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0">
      <div class="txt title" id="title"></div>
      <div class="txt line" id="line"></div>
    </div>
  </div>
  <script id="job" type="application/json">__JOB_JSON__</script>
  <script>
    const job = JSON.parse(document.getElementById("job").textContent);
    document.getElementById("title").textContent = job.title;
    document.getElementById("line").textContent = job.line;
    const tl = gsap.timeline({ paused: true });
    const m = job.motion, d = job.duration;
    tl.fromTo("#back", { rotateX: 62, rotateY: -20, z: -300 }, { rotateY: 25, z: -200, duration: d, ease: "none" }, 0);
    tl.fromTo("#mid", { rotateX: 58, rotateY: 30, z: 0 }, { rotateY: -40, z: 80, duration: d, ease: "none" }, 0);
    tl.fromTo("#front", { z: 200, x: -60 }, { z: 260, x: 60, duration: d, ease: "none" }, 0);
    tl.from("#title", { y: 30, autoAlpha: 0, duration: m.enter_s, ease: m.enter }, 0.2);
    tl.from("#line", { y: 20, autoAlpha: 0, duration: m.enter_s, ease: m.enter }, 0.5);
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
    tl.seek(0);
  </script>
</body>
</html>
