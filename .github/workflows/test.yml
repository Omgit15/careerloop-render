name: test
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned generator SHA
        id: pin
        run: echo "sha=$(jq -r .generator.sha render.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: idrsdev/instagram-carousel-generator
          ref: ${{ steps.pin.outputs.sha }}
          path: vendor/idrs
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Fonts from the pinned generator
        run: |
          python vendor/idrs/skills/social-carousel-generator/scripts/download_fonts.py \
            --ds vendor/idrs/skills/social-carousel-generator/references/design-system.sample.json \
            --out fonts.json || echo "fonts unavailable; rendering with system fonts"
      - name: 5-slide carousel renders 5 JPEGs with valid Pages URLs
        run: python -m pytest -q
